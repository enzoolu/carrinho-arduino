<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle Carrinho Arduino v4</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-motion="idle" data-command="0">
  <main class="app">
    <header class="topbar">
      <h1>Controle Bluetooth para Arduino</h1>
    </header>

    <section class="connection-bar" aria-label="Estado da conexao e comandos">
      <button id="connectBtn" class="connect-btn" type="button">
        <span class="connect-dot" aria-hidden="true"></span>
        <span class="connect-label">Conectar Bluetooth</span>
      </button>

      <div class="status-stack">
        <p id="status" class="status">Status: desconectado</p>
      </div>
    </section>

    <section class="drive-panel" aria-label="Visualizacao do movimento">
      <div class="drive-header">
        <div class="direction-chip">
          <span class="chip-kicker">Direção</span>
          <strong id="motionLabel">Parado</strong>
        </div>
      </div>

      <div class="track-grid" aria-hidden="true"></div>
      <div class="motion-ring" aria-hidden="true"></div>

      <div id="cartStage" class="cart-stage" aria-hidden="true">
        <div id="cart" class="cart">
          <div class="cart-shadow"></div>
          <div class="cart-body">
            <div class="cart-nose"></div>
            <div class="cart-cabin"></div>
            <span class="cart-light cart-light-left"></span>
            <span class="cart-light cart-light-right"></span>
            <span class="wheel wheel-front-left"></span>
            <span class="wheel wheel-front-right"></span>
            <span class="wheel wheel-back-left"></span>
            <span class="wheel wheel-back-right"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="control-shell" aria-label="Controles direcionais">
      <div class="controls">
        <button class="control-btn combo" data-code="Q" data-combo="W,A" type="button" aria-label="Frente esquerda">
          <span class="btn-icon" aria-hidden="true">&nwarr;</span>
          <span class="btn-label">Frente Esq</span>
        </button>

        <button class="control-btn forward" data-code="W" data-command="W" type="button" aria-label="Frente">
          <span class="btn-icon" aria-hidden="true">&uarr;</span>
          <span class="btn-label">Frente</span>
        </button>

        <button class="control-btn combo" data-code="E" data-combo="W,D" type="button" aria-label="Frente direita">
          <span class="btn-icon" aria-hidden="true">&nearr;</span>
          <span class="btn-label">Frente Dir</span>
        </button>

        <button class="control-btn lateral" data-code="A" data-command="A" type="button" aria-label="Esquerda">
          <span class="btn-icon" aria-hidden="true">&larr;</span>
          <span class="btn-label">Esquerda</span>
        </button>

        <button class="control-btn stop" data-code="0" data-command="0" type="button" aria-label="Parar">
          <span class="btn-icon stop-icon" aria-hidden="true">&#9632;</span>
          <span class="btn-label">Parar</span>
        </button>

        <button class="control-btn lateral" data-code="D" data-command="D" type="button" aria-label="Direita">
          <span class="btn-icon" aria-hidden="true">&rarr;</span>
          <span class="btn-label">Direita</span>
        </button>

        <button class="control-btn combo" data-code="Z" data-combo="S,A" type="button" aria-label="Re esquerda">
          <span class="btn-icon" aria-hidden="true">&swarr;</span>
          <span class="btn-label">Re Esq</span>
        </button>

        <button class="control-btn backward" data-code="S" data-command="S" type="button" aria-label="Re">
          <span class="btn-icon" aria-hidden="true">&darr;</span>
          <span class="btn-label">Re</span>
        </button>

        <button class="control-btn combo" data-code="C" data-combo="S,D" type="button" aria-label="Re direita">
          <span class="btn-icon" aria-hidden="true">&searr;</span>
          <span class="btn-label">Re Dir</span>
        </button>
      </div>

    </section>

    <section class="collision-card" aria-label="Estado de colisao">
      <span id="collisionDot" class="collision-dot" aria-hidden="true"></span>
      <p id="collisionStatus">Nenhuma colisão detectada</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
